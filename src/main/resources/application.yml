spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/student_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    # ${环境变量名} —— 从环境变量读取，不在代码里保留任何真实凭证
    # ⚠️ 故意不写默认值：宁可启动报错，也不让密码留在公开仓库里
    # 本地开发前需先设置环境变量：DB_USERNAME、DB_PASSWORD
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

